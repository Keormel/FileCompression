# Hotspot admin panel (/admin/hotspot): lets the container watch and control the Pi's Wi-Fi
# access point. Set FILECOMP_HOTSPOT_ADMIN_PASSWORD in .env, then either run
#
#   docker compose -f docker-compose.yml -f docker-compose.hotspot.yml up -d --build
#
# or add COMPOSE_FILE=docker-compose.yml:docker-compose.hotspot.yml to .env so a plain
# `docker compose up -d` includes this file. Needs Docker Compose 2.24+ for !reset.
services:
  filecompression:
    # Kick (iw station del) and block (nftables) need NET_ADMIN on the host network.
    cap_add:
      - NET_ADMIN
    # The app runs as a non-root user, which gets NET_ADMIN only through the file capability
    # set on iw and nft in the image; no-new-privileges would block exactly that.
    security_opt: !reset []
    volumes:
      # dnsmasq lease file with IP addresses and hostnames (read-only).
      - /var/lib/NetworkManager:/var/lib/NetworkManager:ro
      # wpa_supplicant control socket for a polite deauthenticate; without it kicks fall back to iw.
      - /run/wpa_supplicant:/run/wpa_supplicant
