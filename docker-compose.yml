# FileComp for a Raspberry Pi (or any Linux box) on the local network.
#
#   cp .env.example .env && mkdir -p data && docker compose up -d --build
#
# Then open http://<pi-address>:8000 (or http://<hostname>.local:8000) from any device on the LAN.
services:
  filecompression:
    build: .
    image: filecompression:latest
    container_name: filecompression
    restart: unless-stopped
    init: true
    # Host networking lets the app see the real LAN interfaces (eth0 / wlan0) instead of a
    # Docker bridge, so /api/network-info, share links and QR codes carry the LAN address,
    # and the host's mDNS name (<hostname>.local) points straight at the app.
    network_mode: host
    # Run as the owner of the data directory so files on the host stay accessible.
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      FILECOMP_WEB_HOST: ${FILECOMP_WEB_HOST:-0.0.0.0}
      FILECOMP_WEB_PORT: ${FILECOMP_WEB_PORT:-8000}
      FILECOMP_PUBLIC_HOST: ${FILECOMP_PUBLIC_HOST:-}
      FILECOMP_PUBLIC_URL: ${FILECOMP_PUBLIC_URL:-}
      FILECOMP_LOG_LEVEL: ${FILECOMP_LOG_LEVEL:-INFO}
      FILECOMP_ALLOWED_ORIGINS: ${FILECOMP_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      FILECOMP_WORKERS: ${FILECOMP_WORKERS:-}
      FILECOMP_MAX_CONCURRENT_COMPRESSIONS: ${FILECOMP_MAX_CONCURRENT_COMPRESSIONS:-1}
      FILECOMP_MAX_CONCURRENT_UPLOADS: ${FILECOMP_MAX_CONCURRENT_UPLOADS:-16}
      FILECOMP_MAX_UPLOADS_PER_CLIENT: ${FILECOMP_MAX_UPLOADS_PER_CLIENT:-2}
      FILECOMP_MAX_PENDING_JOBS: ${FILECOMP_MAX_PENDING_JOBS:-32}
      FILECOMP_UPLOAD_SLOT_WAIT_SECONDS: ${FILECOMP_UPLOAD_SLOT_WAIT_SECONDS:-15}
      FILECOMP_UPLOAD_IDLE_TIMEOUT_SECONDS: ${FILECOMP_UPLOAD_IDLE_TIMEOUT_SECONDS:-30}
      FILECOMP_MAX_CONNECTIONS: ${FILECOMP_MAX_CONNECTIONS:-256}
      FILECOMP_MAX_UPLOAD_BYTES: ${FILECOMP_MAX_UPLOAD_BYTES:-4294967296}
      FILECOMP_MAX_TRANSFERS: ${FILECOMP_MAX_TRANSFERS:-32}
      FILECOMP_KEEP_ORIGINAL: ${FILECOMP_KEEP_ORIGINAL:-true}
      FILECOMP_MAX_TRANSFER_BYTES: ${FILECOMP_MAX_TRANSFER_BYTES:-17179869184}
      FILECOMP_MIN_FREE_BYTES: ${FILECOMP_MIN_FREE_BYTES:-536870912}
      FILECOMP_TRANSFER_TTL_SECONDS: ${FILECOMP_TRANSFER_TTL_SECONDS:-1800}
      FILECOMP_ENABLE_SESSIONS: ${FILECOMP_ENABLE_SESSIONS:-false}
      FILECOMP_TRANSFER_HOST: ${FILECOMP_TRANSFER_HOST:-}
      FILECOMP_API_KEY: ${FILECOMP_API_KEY:-}
      FILECOMP_RATE_LIMIT_WINDOW_SECONDS: ${FILECOMP_RATE_LIMIT_WINDOW_SECONDS:-60}
      FILECOMP_RATE_LIMIT_REQUESTS: ${FILECOMP_RATE_LIMIT_REQUESTS:-120}
      FILECOMP_RATE_LIMIT_READ_REQUESTS: ${FILECOMP_RATE_LIMIT_READ_REQUESTS:-1200}
      # Hotspot admin panel (/admin/hotspot); off while the password is empty.
      FILECOMP_HOTSPOT_ADMIN_PASSWORD: ${FILECOMP_HOTSPOT_ADMIN_PASSWORD:-}
      FILECOMP_HOTSPOT_IFACE: ${FILECOMP_HOTSPOT_IFACE:-wlan0}
      FILECOMP_HOTSPOT_LEASES: ${FILECOMP_HOTSPOT_LEASES:-}
    volumes:
      # Point FILECOMP_DATA_DIR at a USB SSD/HDD for large files (e.g. /mnt/ssd/filecomp);
      # an SD card is slow and wears out under heavy writes.
      - ${FILECOMP_DATA_DIR:-./data}:/var/lib/filecompression
      # Hotspot admin panel: dnsmasq lease file with IP addresses and hostnames (read-only).
      - /var/lib/NetworkManager:/var/lib/NetworkManager:ro
      # Hotspot admin panel: wpa_supplicant control socket for a polite deauthenticate;
      # without it kicks fall back to `iw station del`.
      - /run/wpa_supplicant:/run/wpa_supplicant
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    # No no-new-privileges here: the app runs as a non-root user and gets NET_ADMIN only through
    # the file capability set on iw and nft in the image, which that option would block.
    cap_drop:
      - ALL
    # Hotspot admin panel: kick (iw station del) and block (nftables) on the host network.
    # Only iw and nft can use it; the panel stays off until FILECOMP_HOTSPOT_ADMIN_PASSWORD is set.
    cap_add:
      - NET_ADMIN
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
