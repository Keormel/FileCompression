[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filecompression"
version = "0.1.0"
description = "Educational lossless file compression and transfer system"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "matplotlib>=3.8"]

[project.scripts]
filecompression = "filecompression.cli:main"
filecompression-server = "filecompression.server_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["filecompression"]
omit = ["*/cli.py", "*/server_cli.py", "*/gui/*"]
